version: '3.8'

services:
  db-postgres:
    image: postgres:15-alpine
    container_name: pagos-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pagos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Puerto para la interfaz de administración de RabbitMQ
    restart: unless-stopped

  app-pagos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagos-app
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db-postgres
      - rabbitmq

volumes:
  pgdata:
